<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timely</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#354a5f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--sh:#354a5f;--bg:#f5f6f7;--card:#fff;--tx:#32363a;--mu:#6a6d70;--ln:#d9d9d9;--ac:#0a6ed1;--ok:#107e3e;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:#0d1217;--bg:#12171c;--card:#1d232a;--tx:#eaecee;--mu:#9ba1a7;--ln:#38414a;--ac:#4db1ff;--ok:#5dc383}}
:root[data-theme="dark"]{--sh:#0d1217;--bg:#12171c;--card:#1d232a;--tx:#eaecee;--mu:#9ba1a7;--ln:#38414a;--ac:#4db1ff;--ok:#5dc383}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "72","72full",Arial,Helvetica,sans-serif}
.shell{background:var(--sh);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.shell b{font-size:16px;font-weight:600;flex:1}
.shell select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 8px;font-size:14px;max-width:48%}
.shell select option{color:#000}
main{max-width:640px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
.oh{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.oh small{color:var(--mu);display:block;font-size:12px}
.oh .n{font-size:18px;font-weight:600}
.oh .t{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--mu);color:var(--mu)}
.st.run{border-color:var(--ok);color:var(--ok)}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin:12px 0;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:10px 14px;font:inherit;font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.hd{font-size:13px;color:var(--mu);margin:14px 2px 6px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:8px;padding:14px 10px;min-height:68px;text-align:left;font:inherit;font-weight:600;color:var(--tx);display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile small{font-weight:400;color:var(--mu)}
.tile.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.tile.act small{color:#fff;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit}
.chip{border-radius:99px;padding:5px 12px}
.chip.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.neg{color:#bb0000;border-color:#bb0000}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px}
.kpi small{color:var(--mu)}.kpi div{font-size:22px;font-weight:300;margin-top:2px}
.b{margin:10px 0}.b .l{display:flex;justify-content:space-between}
.b .tr{height:8px;background:var(--ln);border-radius:4px;margin-top:4px;overflow:hidden}.b .f{height:100%}
.tl{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--ln)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--ln)}
td{padding:8px 4px;border-bottom:1px solid var(--ln);font-size:13px}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.dlg>div{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:560px}
.dlg textarea{width:100%;height:42vh;font:12px monospace;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;margin:8px 0}
.big{width:100%;font-size:20px;padding:16px}.ti{flex:1;font:inherit;font-size:18px;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
</style></head>
<body>
<div class="shell"><b>⏱ Timely</b><select id="prof"></select></div>
<main>
<div class="oh"><div><small id="st"></small><div class="n" id="cn"></div></div><div class="t" id="clk">0:00:00</div></div>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
</main>
<div class="dlg" id="ask"><div><div id="am" style="font-size:16px;margin-bottom:10px"></div><input id="ai" class="ti" style="width:100%;margin-bottom:10px"><div class="chips" style="justify-content:flex-end"><button class="btn" id="an">Cancel</button><button class="btn pri" id="ay">OK</button></div></div></div>
<div class="dlg" id="wk"><div><div style="font-size:20px;font-weight:600">Good morning ☀️</div><div class="mu" style="margin:4px 0 14px">When did you wake up?</div><button class="btn pri big" id="wn">Now</button><div class="chips" style="margin-top:12px;flex-wrap:nowrap"><input type="time" id="wt" class="ti"><button class="btn" id="ws">Set</button></div><button class="chip" id="wx" style="margin-top:14px">Skip</button></div></div>
<div class="dlg" id="dlg"><div><b id="dt"></b><textarea id="dx" readonly></textarea>
<div class="chips"><button class="btn pri" id="dsh">Save / Share file</button><button class="btn" id="dcp">Copy</button><button class="btn" id="dcl">Close</button></div></div></div>
<script>
var PAL=["#0a6ed1","#e9730c","#107e3e","#a100c2","#bb0000","#d04343","#0097a7","#5d6d7e","#6c4f9e","#c18f00"];
var DEF=["💼 Work","📚 Study","🏃 Exercise","👥 Social","🧹 Chores","🍽 Meals","🚌 Commute","📱 Scrolling","😴 Rest"];
var S,tab="track",off=0,range="day",nref=null;
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(){try{localStorage.setItem("tl2",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return "p"+Date.now().toString(36)+Math.floor(Math.random()*999)}
S=ld("tl2",null);
if(!S){var id=uid();S={a:id,notif:false,p:[{id:id,n:"Me",cats:ld("tl_cats",DEF.slice()),log:ld("tl_log",[])}]}}
function P(){return S.p.filter(function(p){return p.id===S.a})[0]||S.p[0]}
function cur(){var l=P().log;l=l[l.length-1];return l&&!l.e?l:null}
function col(c){var i=P().cats.indexOf(c);return PAL[(i<0?0:i)%PAL.length]}
function fmt(ms){var m=Math.round(ms/60000),h=Math.floor(m/60);return h?h+"h "+(m%60)+"m":m+"m"}
function p2(n){return ("0"+n).slice(-2)}
function ds(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function ts(d){return p2(d.getHours())+":"+p2(d.getMinutes())}

/* tracking */
function start(c){
  var L=P().log,now=Date.now(),c0=cur(),s=now-off*60000;
  if(c0&&c0.c===c){c0.e=now;off=0;save();note();return}
  if(c0)c0.e=Math.max(c0.s,s);
  L.push({c:c,s:Math.max(s,c0?c0.s:0),e:null});off=0;save();note();
}
function stop(){var c=cur();if(c){c.e=Date.now();save();note()}}

/* notification (best effort) */
async function note(){
  if(!S.notif||!("Notification" in window)||Notification.permission!=="granted")return;
  var c=cur(),reg=null;
  try{reg=await navigator.serviceWorker.getRegistration()}catch(e){}
  try{
    if(nref){nref.close();nref=null}
    if(reg){var o=await reg.getNotifications({tag:"timely"});o.forEach(function(n){n.close()})}
    if(!c)return;
    var opt={body:"Started "+ts(new Date(c.s))+" · "+P().n,tag:"timely",silent:true,requireInteraction:true};
    if(reg)await reg.showNotification("⏱ Tracking: "+c.c,opt);else nref=new Notification("⏱ Tracking: "+c.c,opt);
  }catch(e){}
}
async function enableNote(){
  if(!("Notification" in window)){say("Notifications aren't supported here.");return}
  var r=await Notification.requestPermission();
  S.notif=r==="granted";save();
  if(!S.notif)say("Notification permission was denied. Allow it in Android Settings › Apps › Timely › Notifications.");
  else{note();if(!cur())testNote()}
  render();
}
async function testNote(){
  try{var reg=await navigator.serviceWorker.getRegistration();
    if(reg)await reg.showNotification("⏱ Timely",{body:"Notifications are on.",tag:"timely-test"});
    else nref=new Notification("⏱ Timely",{body:"Notifications are on."});
  }catch(e){say("This device blocked the notification (installed web apps without a service worker can't show them).")}
}

/* stats */
function stats(){
  var L=P().log,now=Date.now(),d=new Date();d.setHours(0,0,0,0);
  var from=range==="day"?d.getTime():d.getTime()-6*864e5,t={},tot=0,sw=0,best=null;
  L.forEach(function(l){var s=Math.max(l.s,from),e=Math.min(l.e||now,now);if(e<=s)return;
    t[l.c]=(t[l.c]||0)+(e-s);tot+=e-s;if(l.s>=from)sw++;if(!best||e-s>best.d)best={c:l.c,d:e-s}});
  return{t:t,tot:tot,sw:sw,best:best,from:from,now:now};
}

/* export */
function rows(){return P().log.map(function(l){var s=new Date(l.s),e=l.e?new Date(l.e):null;
  return{d:ds(s),s:ts(s),e:e?ts(e):"running",m:Math.round(((l.e||Date.now())-l.s)/60000),c:l.c}})}
function exp(pid,kind){
  var pr=S.p.filter(function(p){return p.id===pid})[0],keep=S.a;S.a=pid;var R=rows();S.a=keep;
  var out,name=pr.n.replace(/\W+/g,"_")+"_timelog."+(kind==="csv"?"csv":"txt");
  if(kind==="csv"){out="date,start,end,minutes,activity,profile\n"+R.map(function(r){
    return [r.d,r.s,r.e,r.m,'"'+r.c.replace(/"/g,'""')+'"','"'+pr.n.replace(/"/g,'""')+'"'].join(",")}).join("\n")}
  else{out="Timely log – "+pr.n+"\n"+R.map(function(r){return r.d+"  "+r.s+"–"+r.e+"  ("+fmt(r.m*60000)+")  "+r.c}).join("\n")}
  document.getElementById("dt").textContent=name;document.getElementById("dx").value=out;
  document.getElementById("dlg").style.display="flex";
  document.getElementById("dsh").onclick=async function(){
    try{var f=new File([out],name,{type:kind==="csv"?"text/csv":"text/plain"});
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});
      else await navigator.share({title:name,text:out})}catch(e){}};
  document.getElementById("dcp").onclick=function(){var x=document.getElementById("dx");x.select();
    try{navigator.clipboard.writeText(out)}catch(e){document.execCommand("copy")}};
}
document.getElementById("dcl").onclick=function(){document.getElementById("dlg").style.display="none"};

/* views */
function vTrack(){
  var c0=cur(),h='<div class="hd">Started</div><div class="chips">';
  [0,5,15,30].forEach(function(o){h+='<button class="chip'+(o===off?" on":"")+'" data-o="'+o+'">'+(o?o+"m ago":"now")+'</button>'});
  h+='</div><div class="hd">Activities – tap to start</div><div class="tiles">';
  var st=stats0();
  P().cats.forEach(function(c,i){
    h+='<button class="tile'+(c0&&c0.c===c?" act":"")+'" style="--c:'+col(c)+'" data-c="'+i+'">'+esc(c)+'<small>'+(c0&&c0.c===c?"Running · tap to stop":fmt(st[c]||0)+" today")+'</small></button>'});
  return h+'</div><div class="chips" style="margin-top:12px"><button class="btn" id="bs">Stop</button><button class="btn" id="bu">Undo last</button></div>';
}
function stats0(){var d=new Date();d.setHours(0,0,0,0);var f=d.getTime(),n=Date.now(),t={};
  P().log.forEach(function(l){var s=Math.max(l.s,f),e=Math.min(l.e||n,n);if(e>s)t[l.c]=(t[l.c]||0)+e-s});return t}
function vIns(){
  var st=stats(),k=Object.keys(st.t),h='<div class="chips"><button class="chip'+(range==="day"?" on":"")+'" data-r="day">Today</button><button class="chip'+(range==="week"?" on":"")+'" data-r="week">7 days</button></div><div style="height:10px"></div>';
  if(!k.length)return h+'<div class="card mu">No data yet. Start tracking on the Track tab.</div>';
  k.sort(function(a,b){return st.t[b]-st.t[a]});
  h+='<div class="kpis"><div class="kpi"><small>Total tracked</small><div>'+fmt(st.tot)+'</div></div><div class="kpi"><small>Top activity</small><div style="font-size:16px;font-weight:600">'+esc(k[0])+'</div></div><div class="kpi"><small>Switches</small><div>'+st.sw+'</div></div><div class="kpi"><small>Longest block</small><div>'+fmt(st.best.d)+'</div></div><div class="kpi"><small>Woke up</small><div>'+wakeTxt()+'</div></div><div class="kpi"><small>Untracked since waking</small><div>'+untrTxt()+'</div></div></div><div style="height:10px"></div><div class="card">';
  if(range==="day"){var sp=Math.max(st.now-st.from,1);h+='<div class="tl">';
    P().log.forEach(function(l){var s=Math.max(l.s,st.from),e=Math.min(l.e||st.now,st.now);if(e>s)h+='<div style="width:'+((e-s)/sp*100)+'%;background:'+col(l.c)+'"></div>'});h+='</div>'}
  else h+='<div class="mu">Average '+fmt(st.tot/7)+' tracked per day</div>';
  k.forEach(function(c){var p=st.t[c]/st.tot*100;
    h+='<div class="b"><div class="l"><span>'+esc(c)+'</span><span>'+fmt(st.t[c])+' · '+Math.round(p)+'%</span></div><div class="tr"><div class="f" style="width:'+p+'%;background:'+col(c)+'"></div></div></div>'});
  return h+'</div>';
}
function vLog(){
  var R=rows(),L=P().log;if(!R.length)return '<div class="card mu">No entries yet.</div>';
  var h='<div class="card"><table><tr><th>Date</th><th>Time</th><th>Dur.</th><th>Activity</th><th></th></tr>';
  for(var i=R.length-1;i>=Math.max(0,R.length-100);i--){var r=R[i];
    h+='<tr><td>'+r.d.slice(5)+'</td><td>'+r.s+'–'+r.e+'</td><td>'+fmt(r.m*60000)+'</td><td>'+esc(r.c)+'</td><td><button class="chip" data-x="'+i+'">✕</button></td></tr>'}
  return h+'</table></div>';
}
function vSet(){
  var h='<div class="hd">Profiles</div><div class="card">';
  S.p.forEach(function(p){
    h+='<div class="row"><b>'+esc(p.n)+(p.id===S.a?' <span class="st run">active</span>':'')+'</b><span class="chips">'
     +'<button class="chip" data-e="'+p.id+'|csv">CSV</button><button class="chip" data-e="'+p.id+'|txt">Text</button>'
     +'<button class="chip" data-rn="'+p.id+'">Rename</button><button class="chip" data-dp="'+p.id+'">Delete</button></span></div>'});
  h+='<div class="row"><button class="btn pri" id="ap">+ New profile</button></div></div>';
  h+='<div class="hd">Activities – '+esc(P().n)+'</div><div class="card">';
  P().cats.forEach(function(c,i){h+='<div class="row"><span>'+esc(c)+'</span><button class="chip" data-dc="'+i+'">Remove</button></div>'});
  h+='<div class="row"><button class="btn pri" id="ac">+ New activity</button></div></div>';
  var pl=P().places||{};
  h+='<div class="hd">Auto-location</div><div class="card"><div class="row"><span>Auto-label Home / College / Commute</span><button class="btn'+(P().auto?" pri":"")+'" id="al">'+(P().auto?"On":"Turn on")+'</button></div>'
   +["home","college"].map(function(k){return '<div class="row"><span>'+(k==="home"?"🏠 Home":"🎓 College")+': <b>'+(pl[k]?"saved":"not set")+'</b></span><span class="chips"><button class="chip" data-pl="'+k+'">Set to where I am now</button>'+(pl[k]?'<button class="chip" data-pc="'+k+'">Clear</button>':"")+'</span></div>'}).join("")
   +'<div class="mu" style="margin-bottom:6px">Status: '+(P().auto?geoMsg:"Off")+'</div><div class="mu">Stand at each place once and tap Set. Arriving starts that place, leaving starts Commute. Activities you tap yourself are never overridden while you stay in the same place.</div></div>';
  h+='<div class="hd">Today</div><div class="card"><div class="row"><span>Woke up: <b>'+wakeTxt()+'</b></span><button class="chip" id="wc">Change</button></div></div>';
  h+='<div class="hd">Notification</div><div class="card"><div class="row"><span>Show “tracking” notification</span><button class="btn'+(S.notif?" pri":"")+'" id="nt">'+(S.notif?"On":"Turn on")+'</button></div>'
   +(S.notif?'<div class="row"><span class="mu">Not showing?</span><button class="chip" id="nt2">Send test</button></div>':'')
   +'<div class="mu">The timer always keeps counting in the background, since it works from start times.</div></div>';
  return h;
}
function render(){
  var s=document.getElementById("prof");
  s.innerHTML=S.p.map(function(p){return '<option value="'+p.id+'"'+(p.id===S.a?" selected":"")+'>'+esc(p.n)+'</option>'}).join("");
  document.getElementById("tabs").innerHTML=[["track","Track"],["ins","Insights"],["log","Log"],["set","Settings"]].map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
  document.getElementById("v").innerHTML={track:vTrack,ins:vIns,log:vLog,set:vSet}[tab]();
  tick();
}
function tick(){
  var c=cur(),e=document.getElementById("st");
  e.innerHTML=c?'<span class="st run">Running</span>':'<span class="st">Idle</span>';
  document.getElementById("cn").textContent=c?c.c:"Nothing running";
  var s=c?Math.floor((Date.now()-c.s)/1000):0;
  document.getElementById("clk").textContent=Math.floor(s/3600)+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60);
}

/* in-app dialogs (browser prompt/confirm/alert are blocked in installed pages) */
function ask(msg,val,cb){var d=document.getElementById("ask"),i=document.getElementById("ai");
  document.getElementById("am").textContent=msg;document.getElementById("an").style.display="";
  i.style.display=val===null?"none":"block";i.value=val||"";d.style.display="flex";
  if(val!==null)setTimeout(function(){i.focus()},60);
  document.getElementById("ay").onclick=function(){d.style.display="none";cb(i.value.trim())};
  document.getElementById("an").onclick=function(){d.style.display="none"}}
function say(m){ask(m,null,function(){});document.getElementById("an").style.display="none"}
var geoMsg="Not started";
/* auto-location */
var LBL={home:"🏠 Home",college:"🎓 College",transit:"🚌 Commute"},lastFix=null,pend=null,gw=null;
function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos(a*r);return Math.sqrt(x*x+y*y)*6371000}
function ensureCat(c){var k=P().cats;if(k.indexOf(c)<0)k.push(c)}
function autoStart(c){ensureCat(c);var L=P().log,n=Date.now(),c0=cur();if(c0&&c0.c===c)return;if(c0)c0.e=n;L.push({c:c,s:n,e:null,auto:true});save();note();render()}
function zoneOf(pos){
  var c=pos.coords,pl=P().places||{},acc=c.accuracy||50,z=null;
  if(acc>300)return null;
  ["home","college"].forEach(function(k){var q=pl[k];if(q&&dist(q.lat,q.lon,c.latitude,c.longitude)<=Math.max(200,acc))z=k});
  var sp=c.speed;
  if(sp==null&&lastFix&&pos.timestamp-lastFix.t>8000)sp=dist(lastFix.lat,lastFix.lon,c.latitude,c.longitude)/((pos.timestamp-lastFix.t)/1000);
  lastFix={lat:c.latitude,lon:c.longitude,t:pos.timestamp};
  if(z)return z;
  return (sp!=null&&sp>1.5)?"transit":"other";
}
function onFix(pos){
  var p=P();if(!p.auto)return;
  if(geoMsg!=="Working"){geoMsg="Working";if(tab==="set")render()}
  var z=zoneOf(pos);if(!z)return;
  var prev=p.zone||null;
  if(z==="other"&&(prev==="home"||prev==="college"||prev==="transit"))z="transit";
  if(z===prev){pend=null;return}
  if(z==="other"){p.zone="other";save();return}
  if(z==="transit"&&pend!=="transit"){pend="transit";return}
  pend=null;p.zone=z;save();
  if(!prev&&cur())return;
  autoStart(LBL[z]);
}
function geoStop(){if(gw!=null){try{navigator.geolocation.clearWatch(gw)}catch(e){}gw=null}}
function geoStart(){geoStop();if(!P().auto||!navigator.geolocation||document.hidden)return;
  try{gw=navigator.geolocation.watchPosition(onFix,function(er){geoMsg="Problem: "+(er.message||"no permission");if(tab==="set")render()},{enableHighAccuracy:true,maximumAge:15000,timeout:30000})}catch(e){}}
function setPlace(k){
  if(!navigator.geolocation){say("Location isn't available here.");return}
  navigator.geolocation.getCurrentPosition(function(pos){
    var p=P();p.places=p.places||{};p.places[k]={lat:pos.coords.latitude,lon:pos.coords.longitude};
    ensureCat(LBL[k]);ensureCat(LBL.transit);p.zone=k;save();render();
    say((k==="home"?"Home":"College")+" saved at your current location.");
  },function(er){say("Could not get location: "+(er&&er.message?er.message:"permission denied")+". Allow location for Chrome and this app in Android settings.")},{enableHighAccuracy:true,timeout:20000});
}

function untrTxt(){var w=wakeTs();if(!w)return "—";var n=Date.now(),sum=0;P().log.forEach(function(l){var s=Math.max(l.s,w),e=Math.min(l.e||n,n);if(e>s)sum+=e-s});return fmt(Math.max(0,n-w-sum))}

  else if(b.id==="ac"){ask("Activity name (emoji optional)","",function(n){if(n){P().cats.push(n);save();render()}})}
