<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timely</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#354a5f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--sh:#354a5f;--bg:#f5f6f7;--card:#fff;--tx:#32363a;--mu:#6a6d70;--ln:#d9d9d9;--ac:#0a6ed1;--ok:#107e3e;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:#0d1217;--bg:#12171c;--card:#1d232a;--tx:#eaecee;--mu:#9ba1a7;--ln:#38414a;--ac:#4db1ff;--ok:#5dc383}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "72","72full",Arial,Helvetica,sans-serif}
.shell{background:var(--sh);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.shell b{font-size:16px;font-weight:600;flex:1}
.shell select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 8px;font-size:14px;max-width:48%}
.shell select option{color:#000}
main{max-width:640px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
.oh{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.oh small{color:var(--mu);display:block;font-size:12px}
.oh .n{font-size:18px;font-weight:600}
.oh .t{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--mu);color:var(--mu)}
.st.run{border-color:var(--ok);color:var(--ok)}
#bn{display:none;margin-top:8px;background:var(--card);border:1px solid var(--ok);border-left:5px solid var(--ok);border-radius:8px;padding:10px 12px;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin:12px 0;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:10px 14px;font:inherit;font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.hd{font-size:13px;color:var(--mu);margin:14px 2px 6px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:8px;padding:14px 10px;min-height:68px;text-align:left;font:inherit;font-weight:600;color:var(--tx);display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile small{font-weight:400;color:var(--mu)}
.tile.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.tile.act small{color:#fff;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit}
.chip{border-radius:99px;padding:6px 12px}
.chip.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.neg{color:#bb0000;border-color:#bb0000}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px}
.kpi small{color:var(--mu)}.kpi div{font-size:22px;font-weight:300;margin-top:2px}
.b{margin:10px 0}.b .l{display:flex;justify-content:space-between}
.b .tr{height:8px;background:var(--ln);border-radius:4px;margin-top:4px;overflow:hidden}.b .f{height:100%}
.tl{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--ln)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--ln)}
td{padding:10px 4px;border-bottom:1px solid var(--ln);font-size:13px}
tr[data-ed],tr[data-wd]{cursor:pointer}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.dlg>div{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.dlg textarea{width:100%;height:42vh;font:12px monospace;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;margin:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw{text-align:center;color:var(--mu);font-size:12px}
.cd{border:1px solid var(--ln);border-radius:8px;min-height:58px;padding:4px 1px;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.cd i{font-style:normal;font-size:12px;color:var(--mu)}.cd span{font-size:11px;font-weight:600;white-space:nowrap}.cd.td{border:2px solid var(--ac)}
.big{width:100%;font-size:20px;padding:16px}
.ti{font:inherit;font-size:16px;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
</style></head>
<body>
<div class="shell"><b>⏱ Timely</b><select id="prof"></select></div>
<main>
<div class="oh"><div><small id="st"></small><div class="n" id="cn" data-ed="cur"></div><small>tap name to fix ✎</small></div><div class="t" id="clk">0:00:00</div></div>
<div id="bn"></div>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
</main>

<div class="dlg" id="ask"><div><div id="am" style="font-size:16px;margin-bottom:10px"></div><input id="ai" class="ti" style="width:100%;margin-bottom:10px"><div class="chips" style="justify-content:flex-end"><button class="btn" id="an">Cancel</button><button class="btn pri" id="ay">OK</button></div></div></div>
<div class="dlg" id="wk"><div><div id="wtl" style="font-size:20px;font-weight:600">Good morning ☀️</div><div class="mu" id="wsub" style="margin:4px 0 14px">When did you wake up?</div><button class="btn pri big" id="wn">Now</button><div class="chips" style="margin-top:12px;flex-wrap:nowrap"><input type="time" id="wt" class="ti" style="flex:1"><button class="btn" id="ws">Set</button></div><button class="chip" id="wx" style="margin-top:14px">Skip</button></div></div>
<div class="dlg" id="ed"><div id="edb"></div></div>
<div class="dlg" id="ad"><div id="adb"></div></div>
<div class="dlg" id="imp"><div><b>Paste data</b><div class="mu" style="margin:4px 0">Paste anything: a copied Log screen from an older version, or a CSV export. Lines that aren't entries are ignored. Data goes into the active profile.</div><textarea id="ix" placeholder="Paste here"></textarea><div class="mu" id="im" style="margin-bottom:8px"></div><div class="chips"><button class="btn pri" id="ig">Import</button><button class="btn" id="ic">Close</button></div></div></div>
<div class="dlg" id="dlg"><div><b id="dt"></b><textarea id="dx" readonly></textarea>
<div class="chips"><button class="btn pri" id="dsh">Save / Share file</button><button class="btn" id="dcp">Copy</button><button class="btn" id="dcl">Close</button></div></div></div>

<script>
var PAL=["#0a6ed1","#e9730c","#107e3e","#a100c2","#bb0000","#d04343","#0097a7","#5d6d7e","#6c4f9e","#c18f00"];
var DEF=["💼 Work","📚 Study","🏃 Exercise","👥 Social","🧹 Chores","🍽 Meals","🚌 Commute","📱 Scrolling","😴 Rest"];
var LBL={home:"🏠 Home",college:"🎓 College",transit:"🚌 Commute"};
var calOff=0,S,tab="track",off=0,range="day",pickD="",logN=100,nref=null,wd=null,edIdx=null,edList=[],addCat=null,addMsg="";
var lastFix=null,pend=null,gi=null,geoMsg="Not started",info=null,wlk=null,bnT=null,bnUndo=null;
function $(i){return document.getElementById(i)}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(){try{localStorage.setItem("tl2",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return "p"+Date.now().toString(36)+Math.floor(Math.random()*999)}
function p2(n){return ("0"+n).slice(-2)}
function ds(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function ts(d){return p2(d.getHours())+":"+p2(d.getMinutes())}
function fmt(ms){var m=Math.round(ms/60000),h=Math.floor(m/60);return h?h+"h "+(m%60)+"m":m+"m"}
function atTime(dateStr,hhmm){var q=hhmm.split(":"),d=new Date(dateStr+"T00:00:00");d.setHours(+q[0],+q[1],0,0);return d.getTime()}
pickD=ds(new Date());
S=ld("tl2",null);
if(!S){var id0=uid();S={a:id0,notif:false,p:[{id:id0,n:"Me",cats:DEF.slice(),log:[]}]}}
function P(){return S.p.filter(function(p){return p.id===S.a})[0]||S.p[0]}
function cur(){var l=P().log;l=l[l.length-1];return l&&!l.e?l:null}
function col(c){var i=P().cats.indexOf(c);return PAL[(i<0?0:i)%PAL.length]}
function ensureCat(c){var k=P().cats;if(k.indexOf(c)<0)k.push(c)}

/* dialogs */
function ask(msg,val,cb){var d=$("ask"),i=$("ai");$("am").textContent=msg;$("an").style.display="";
  i.style.display=val===null?"none":"block";i.value=val||"";d.style.display="flex";
  if(val!==null)setTimeout(function(){i.focus()},60);
  $("ay").onclick=function(){d.style.display="none";cb(i.value.trim())};
  $("an").onclick=function(){d.style.display="none"}}
function say(m){ask(m,null,function(){});$("an").style.display="none"}
function banner(msg,undo){bnUndo=undo||null;var e=$("bn");e.style.display="flex";
  e.innerHTML='<span>'+esc(msg)+'</span><span class="chips">'+(undo?'<button class="btn neg" id="bnu">Cancel</button>':"")+'<button class="chip" id="bnx">✕</button></span>';
  clearTimeout(bnT);bnT=setTimeout(function(){e.style.display="none"},undo?180000:5000)}

/* tracking */
function start(c){
  var L=P().log,now=Date.now(),c0=cur(),s=now-off*60000;
  if(c0&&c0.c===c){c0.e=now;off=0;save();note();return}
  if(c0)c0.e=Math.max(c0.s,s);
  L.push({c:c,s:Math.max(s,c0?c0.s:0),e:null});off=0;save();note();
}
function stop(){var c=cur();if(c){c.e=Date.now();save();note()}}

/* notification */
async function note(){
  if(!S.notif||!("Notification" in window)||Notification.permission!=="granted")return;
  var c=cur(),reg=null;
  try{reg=await navigator.serviceWorker.getRegistration()}catch(e){}
  try{
    if(nref){nref.close();nref=null}
    if(reg){var o=await reg.getNotifications({tag:"timely"});o.forEach(function(n){n.close()})}
    if(!c)return;
    var opt={body:"Started "+ts(new Date(c.s))+" · "+P().n,tag:"timely",silent:true,requireInteraction:true};
    if(reg)await reg.showNotification("⏱ Tracking: "+c.c,opt);else nref=new Notification("⏱ Tracking: "+c.c,opt);
  }catch(e){}
}
async function enableNote(){
  if(!("Notification" in window)){say("Notifications aren't supported here.");return}
  var r=await Notification.requestPermission();S.notif=r==="granted";save();
  if(!S.notif)say("Notification permission was denied. Allow it in Android Settings, Apps, Timely, Notifications.");else{note();if(!cur())testNote()}
  render();
}
async function testNote(){
  try{var reg=await navigator.serviceWorker.getRegistration();
    if(reg)await reg.showNotification("⏱ Timely",{body:"Notifications are on.",tag:"timely-test"});else nref=new Notification("⏱ Timely",{body:"Notifications are on."});
  }catch(e){say("This device blocked the notification.")}
}

/* auto-location */
function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos(a*r);return Math.sqrt(x*x+y*y)*6371000}
function autoStart(c,at,pz,target){
  var p=P();ensureCat(c);var L=p.log,c0=cur();if(c0&&c0.c===c)return;
  at=Math.max(at,c0?c0.s:0);if(c0)c0.e=at;
  var en={c:c,s:at,e:null,auto:true};L.push(en);save();note();render();
  banner(c+" started automatically ("+ts(new Date(at))+")",function(){
    var i=L.indexOf(en);if(i>=0)L.splice(i,1);if(c0)c0.e=null;
    p.zone=pz||"other";p.mute={z:target,until:Date.now()+30*60000};save();note();render()});
}
function onFix(pos){
  var p=P();if(!p.auto)return;
  var c=pos.coords,acc=c.accuracy||50,pl=p.places||{},prev=p.zone||null,now=Date.now(),near={},z=null,bd=1e12;
  ["home","college"].forEach(function(k){var q=pl[k];if(!q)return;
    var d=dist(q.lat,q.lon,c.latitude,c.longitude);near[k]=d;
    var R=prev===k?Math.max(300,acc):Math.max(200,acc);if(d<=R&&d<bd){z=k;bd=d}});
  var sp=c.speed;
  if(sp==null&&lastFix&&pos.timestamp-lastFix.t>8000)sp=dist(lastFix.lat,lastFix.lon,c.latitude,c.longitude)/((pos.timestamp-lastFix.t)/1000);
  lastFix={lat:c.latitude,lon:c.longitude,t:pos.timestamp};
  geoMsg="Working";info={t:now,acc:acc,near:near};
  if(tab==="set")render();
  if(acc>300)return;
  var target=null,at=now;
  if(z){p.lastIn={z:z,t:now};if(z===prev){pend=null;save();return}target=z}
  else if(prev==="home"||prev==="college"){target="transit";var li=p.lastIn;if(li&&li.z===prev&&now-li.t<45*60000)at=li.t}
  else if(prev==="transit")return;
  else if(sp!=null&&sp>1.5){if(pend!=="transit"){pend="transit";return}target="transit"}
  else{pend=null;if(prev!=="other"){p.zone="other";save()}return}
  pend=null;
  if(!prev&&cur()){p.zone=target;save();return}
  if(p.mute&&p.mute.z===target&&now<p.mute.until){p.zone=target;save();return}
  var pz=prev;p.zone=target;save();autoStart(LBL[target],at,pz,target);
}
function poll(){
  if(!P().auto||document.hidden||!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(onFix,function(er){geoMsg="Problem: "+(er.message||"no permission");if(tab==="set")render()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function geoStop(){if(gi){clearInterval(gi);gi=null}}
function geoStart(){geoStop();if(!P().auto||document.hidden)return;poll();gi=setInterval(poll,15000)}
async function wlSet(){try{if(S.wl&&!document.hidden&&navigator.wakeLock){if(!wlk)wlk=await navigator.wakeLock.request("screen")}else if(wlk){await wlk.release();wlk=null}}catch(e){wlk=null}}
function setPlace(k){
  if(!navigator.geolocation){say("Location isn't available here.");return}
  navigator.geolocation.getCurrentPosition(function(pos){
    var p=P();p.places=p.places||{};p.places[k]={lat:pos.coords.latitude,lon:pos.coords.longitude};
    ensureCat(LBL[k]);ensureCat(LBL.transit);p.zone=k;p.lastIn={z:k,t:Date.now()};save();render();
    say((k==="home"?"Home":"College")+" saved at your current location.");
  },function(er){say("Could not get location: "+(er&&er.message?er.message:"permission denied")+". Allow location for Chrome and for the Timely app in Android settings.")},{enableHighAccuracy:true,timeout:20000});
}
function geoStatus(){
  var p=P();if(!p.auto)return "Off";var s=geoMsg;
  if(info){s+=" · last fix "+ts(new Date(info.t))+" · ±"+Math.round(info.acc)+" m";
    ["home","college"].forEach(function(k){var d=info.near[k];if(d!=null)s+=" · "+(k==="home"?"Home ":"College ")+(d>1000?(d/1000).toFixed(1)+" km":Math.round(d)+" m")})}
  return s+" · zone: "+(p.zone||"none");
}

/* wake-up */
function wakeCheck(){var p=P(),d=ds(new Date());p.wakes=p.wakes||{};if(p.wakes[d]===undefined)openWake(null)}
function openWake(date){
  wd=date;var today=!date;
  $("wtl").textContent=today?"Good morning ☀️":"Wake-up time";
  $("wsub").textContent=today?"When did you wake up?":date;
  $("wn").style.display=today?"":"none";
  $("wx").textContent=today?"Skip":"Cancel";
  var w=date&&(P().wakes||{})[date];
  $("wt").value=w?ts(new Date(w)):ts(new Date());
  $("wk").style.display="flex";
}
function setWake(w){var p=P();p.wakes=p.wakes||{};p.wakes[wd||ds(new Date())]=w;save();$("wk").style.display="none";render()}
$("wn").onclick=function(){setWake(Date.now())};
$("ws").onclick=function(){var v=$("wt").value;if(!v)return;var t=atTime(wd||ds(new Date()),v);setWake(wd?t:Math.min(t,Date.now()))};
$("wx").onclick=function(){if(wd)$("wk").style.display="none";else setWake(0)};
function wakeTs(){return (P().wakes||{})[ds(new Date())]||0}
function untrTxt(){var w=wakeTs();if(!w)return "—";var n=Date.now(),sum=0;P().log.forEach(function(l){var s=Math.max(l.s,w),e=Math.min(l.e||n,n);if(e>s)sum+=e-s});return fmt(Math.max(0,n-w-sum))}

/* stats */
function rangeInfo(){
  var d=new Date();d.setHours(0,0,0,0);var sod=d.getTime(),now=Date.now(),f,t=now;
  if(range==="day")f=sod;
  else if(range==="week")f=sod-6*864e5;
  else if(range==="month")f=sod-29*864e5;
  else if(range==="date"){f=new Date(pickD+"T00:00:00").getTime();t=Math.min(f+864e5,now)}
  else{f=sod;P().log.forEach(function(l){if(l.s<f)f=l.s})}
  return{f:f,t:t,days:Math.max(1,Math.ceil((t-f)/864e5))};
}
function stats(){
  var R=rangeInfo(),t={},tot=0,sw=0,best=null;
  P().log.forEach(function(l){var s=Math.max(l.s,R.f),e=Math.min(l.e||Date.now(),R.t);if(e<=s)return;
    t[l.c]=(t[l.c]||0)+(e-s);tot+=e-s;sw++;if(!best||e-s>best.d)best={c:l.c,d:e-s}});
  return{t:t,tot:tot,sw:sw,best:best,R:R};
}
function stats0(){var d=new Date();d.setHours(0,0,0,0);var f=d.getTime(),n=Date.now(),t={};
  P().log.forEach(function(l){var s=Math.max(l.s,f),e=Math.min(l.e||n,n);if(e>s)t[l.c]=(t[l.c]||0)+e-s});return t}
function wakesIn(R){var W=P().wakes||{},o=[];
  Object.keys(W).forEach(function(k){var kd=new Date(k+"T00:00:00").getTime();if(kd+864e5>R.f&&kd<=R.t)o.push({d:k,w:W[k]})});
  o.sort(function(a,b){return a.d<b.d?1:-1});return o}

/* export */
function exp(pid,kind){
  var pr=S.p.filter(function(p){return p.id===pid})[0],out,name=pr.n.replace(/\W+/g,"_")+"_timelog."+(kind==="csv"?"csv":"txt");
  var R=pr.log.map(function(l){var s=new Date(l.s),e=l.e?new Date(l.e):null;return{k:ds(s)+" "+ts(s),d:ds(s),s:ts(s),e:e?ts(e):"running",m:Math.round(((l.e||Date.now())-l.s)/60000),c:l.c}});
  var W=pr.wakes||{};Object.keys(W).forEach(function(k){if(W[k]){var t=ts(new Date(W[k]));R.push({k:k+" "+t,d:k,s:t,e:t,m:0,c:"⏰ Woke up"})}});
  R.sort(function(a,b){return a.k<b.k?-1:1});
  if(kind==="csv")out="date,start,end,minutes,activity,profile\n"+R.map(function(r){return [r.d,r.s,r.e,r.m,'"'+r.c.replace(/"/g,'""')+'"','"'+pr.n.replace(/"/g,'""')+'"'].join(",")}).join("\n");
  else out="Timely log – "+pr.n+"\n"+R.map(function(r){return r.d+"  "+r.s+"–"+r.e+"  ("+fmt(r.m*60000)+")  "+r.c}).join("\n");
  $("dt").textContent=name;$("dx").value=out;$("dlg").style.display="flex";
  $("dsh").onclick=async function(){try{var f=new File([out],name,{type:kind==="csv"?"text/csv":"text/plain"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else await navigator.share({title:name,text:out})}catch(e){}};
  $("dcp").onclick=function(){var x=$("dx");x.select();try{navigator.clipboard.writeText(out)}catch(e){document.execCommand("copy")}};
}
$("dcl").onclick=function(){$("dlg").style.display="none"};

/* edit entry */
function openEdit(i){
  var L=P().log;if(i==="cur")i=L.length-1;var l=L[i];if(!l)return;edIdx=i;
